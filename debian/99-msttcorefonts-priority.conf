<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Priority 1: Map generic families to Microsoft equivalents -->
  <!-- Sans-Serif -> Arial -->
  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Arial</string>
    </edit>
  </match>

  <!-- Serif -> Times New Roman -->
  <match target="pattern">
    <test qual="any" name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Times New Roman</string>
    </edit>
  </match>

  <!-- Monospace -> Consolas / Courier New -->
  <match target="pattern">
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Consolas</string>
      <string>Courier New</string>
    </edit>
  </match>

  <!-- Ensure Segoe UI Emoji is the ABSOLUTE FIRST choice for any explicit emoji request -->
  <match target="pattern">
    <test qual="any" name="family"><string>emoji</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Segoe UI Emoji</string>
    </edit>
  </match>

  <!-- Use Segoe UI Emoji as a fallback for standard text if they contain emojis -->
  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>Segoe UI Emoji</string>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family"><string>serif</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>Segoe UI Emoji</string>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>Segoe UI Emoji</string>
    </edit>
  </match>
</fontconfig>
