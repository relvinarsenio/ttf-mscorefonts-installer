<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer>
      <family>Segoe UI Variable</family>
      <family>Segoe UI</family>
      <family>Arial</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>serif</family>
    <prefer>
      <family>Times New Roman</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>monospace</family>
    <prefer>
      <family>Consolas</family>
      <family>Courier New</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>system-ui</family>
    <prefer>
      <family>Segoe UI Variable</family>
      <family>Segoe UI</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>symbol</family>
    <prefer>
      <family>Segoe UI Symbol</family>
      <family>Webdings</family>
      <family>Wingdings</family>
      <family>Wingdings 2</family>
      <family>Wingdings 3</family>
      <family>Bookshelf Symbol 7</family>
      <family>Segoe MDL2 Assets</family>
      <family>Symbol</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>math</family>
    <prefer>
      <family>Cambria Math</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>cursive</family>
    <prefer>
      <family>Comic Sans MS</family>
      <family>Segoe Script</family>
      <family>Segoe Print</family>
      <family>Bradley Hand ITC</family>
      <family>Monotype Corsiva</family>
      <family>Papyrus</family>
      <family>Pristina</family>
      <family>Freestyle Script</family>
      <family>French Script MT</family>
      <family>Kristen ITC</family>
      <family>Mistral</family>
      <family>Tempus Sans ITC</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>fantasy</family>
    <prefer>
      <family>Impact</family>
      <family>Juice ITC</family>
    </prefer>
  </alias>
  <alias>
    <family>Helvetica</family>
    <prefer>
      <family>Arial</family>
    </prefer>
  </alias>
  <alias>
    <family>Times</family>
    <prefer>
      <family>Times New Roman</family>
    </prefer>
  </alias>
  <alias>
    <family>Courier</family>
    <prefer>
      <family>Courier New</family>
    </prefer>
  </alias>
</fontconfig>
